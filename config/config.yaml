artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  local_data_file: data/raw/online_retail_II.xlsx
  output_file: artifacts/data_ingestion/online_retail_II.xlsx

data_validation:
  root_dir: artifacts/data_validation
  source_file_path: artifacts/data_ingestion/online_retail_II.xlsx
  STATUS_FILE: artifacts/data_validation/status.txt

data_transformation:
  root_dir: artifacts/data_transformation
  source_file_path: artifacts/data_ingestion/online_retail_II.xlsx

model_trainer:
  root_dir: artifacts/model_trainer
  train_data_path: artifacts/data_transformation/train.csv
  test_data_path: artifacts/data_transformation/test.csv
  model_name: model.joblib

model_evaluation:
  root_dir: artifacts/model_evaluation
  test_data_path: artifacts/data_transformation/test.csv
  model_path: artifacts/model_trainer/model.joblib
  report_path: artifacts/model_evaluation/metrics.json

model_monitoring:
  root_dir: artifacts/model_monitoring
  baseline_data_path: artifacts/data_transformation/train.csv
  production_data_path: artifacts/data_transformation/test.csv
  psi_threshold: 0.25
  drift_report_path: artifacts/model_monitoring/drift_report.json

model_maintenance:
  root_dir: artifacts/model_maintenance
  model_registry_path: artifacts/model_maintenance/model_registry.json
  retrain_on_drift: true
  retrain_mode: simulation
